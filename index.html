const Scatter = ({ items, dark }) =>
  h("div", { className: "scat" + (dark ? " dark" : ""), "aria-hidden": "true" },
    h("i", { className: "orb o1" }),
    h("i", { className: "orb o2" }),
    items.map((it, i) => {
      const st = { top: it.t, width: it.s, height: it.s, "--r": it.r + "deg", animationDelay: (i * 1.7) + "s" };
      if (it.l) st.left = it.l; else st.right = it.rt;
      return h("span", { key: i, className: "sc", style: st }, ICONS[it.n]());
    }));

const Rev = ({ tag = "div", className = "", delay = 0, children }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) { el.classList.add("in-view"); return; }
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { const t = e.target; t.classList.add("in-view"); io.unobserve(t); setTimeout(() => { t.style.transitionDelay = "0ms"; }, 1200); }
    }), { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return h(tag, { ref, className: "rev " + className, style: { transitionDelay: delay + "ms" } }, children);
};

const NAV_ITEMS = [["home", "الرئيسية"], ["services", "خدماتنا"], ["contact", "تواصل معنا"]];
const Nav = () => {
  const [act, setAct] = React.useState(0);
  const [bl, setBl] = React.useState({ x: 0, w: 0, ok: false });
  const [rdy, setRdy] = React.useState(false);
  const nav = React.useRef(null), blob = React.useRef(null), refs = React.useRef([]), lock = React.useRef(0), first = React.useRef(true);

  const measure = React.useCallback(() => {
    const n = nav.current, a = refs.current[act];
    if (!n || !a) return;
    const nr = n.getBoundingClientRect(), ar = a.getBoundingClientRect();
    setBl({ x: ar.left - nr.left, w: ar.width, ok: true });
  }, [act]);

  React.useLayoutEffect(measure, [measure]);

  React.useEffect(() => {
    const t = setTimeout(() => setRdy(true), 80);
    window.addEventListener("resize", measure);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    return () => { clearTimeout(t); window.removeEventListener("resize", measure); };
  }, [measure]);

  /* حركة "الجيلي" كل ما البقعة تتنقل */
  React.useEffect(() => {
    if (first.current) { first.current = false; return; }
    const b = blob.current;
    if (!b) return;
    b.classList.remove("jelly"); void b.offsetWidth; b.classList.add("jelly");
  }, [act]);

  /* البقعة تتحرك مع التمرير */
  React.useEffect(() => {
    const f = () => {
      if (Date.now() < lock.current) return;
      const H = window.innerHeight;
      let idx = 0;
      NAV_ITEMS.forEach(([id], i) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= H * 0.35) idx = i;
      });
      if (H + window.scrollY >= document.documentElement.scrollHeight - 6) idx = NAV_ITEMS.length - 1;
      setAct(idx);
    };
    window.addEventListener("scroll", f, { passive: true });
    f();
    return () => window.removeEventListener("scroll", f);
  }, []);

  const go = (e, id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    e.preventDefault();
    lock.current = Date.now() + 1400;
    setAct(i);
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const behavior = calm ? "auto" : "smooth";
    if (id === "home") window.scrollTo({ top: 0, behavior }); else el.scrollIntoView({ behavior, block: "start" });
    setTimeout(() => window.dispatchEvent(new Event("scroll")), 1450);
  };

  return h("nav", { className: "nav" + (rdy ? " rdy" : ""), ref: nav, "aria-label": "القائمة" },
    h("span", { className: "blob", ref: blob, "aria-hidden": "true", style: { width: bl.w, transform: "translateX(" + bl.x + "px)", opacity: bl.ok ? 1 : 0 } }),
    NAV_ITEMS.map(([id, t], i) =>
      h("a", { key: id, href: "#" + id, className: act === i ? "on" : "", ref: el => (refs.current[i] = el), onClick: e => go(e, id, i), "aria-current": act === i ? "true" : undefined }, t)));
};

const Light = () => {
  React.useEffect(() => {
    const f = e => {
      const el = e.target.closest && e.target.closest(".row,.st,.rv blockquote");
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    };
    window.addEventListener("pointermove", f, { passive: true });
    return () => window.removeEventListener("pointermove", f);
  }, []);
  return null;
};

const App = () =>
  h(React.Fragment, null,
    h(Nav), h(Hero), h(Services), h(Steps), h(Team), h(Footer), h(Light));

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
