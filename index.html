ICONS.scrubs = c => svg([P("M8 3L3 6l2 5 3-1v11h8V10l3 1 2-5-5-3"), P("M8 3c.8 2.6 2.4 4 4 4s3.2-1.4 4-4"), P("M13.5 14H16v3h-2.5z")], c);
ICONS.pill = c => svg([P("m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7Z"), P("m8.5 8.5 7 7")], c);
ICONS.thermo = c => svg(P("M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0Z"), c);

const Scatter = ({ items, dark }) =>
  h("div", { className: "scat" + (dark ? " dark" : ""), "aria-hidden": "true" },
    h("i", { className: "orb o1" }),
    h("i", { className: "orb o2" }),
    items.map((it, i) => {
      const st = { top: it.t, width: it.s, height: it.s, "--r": it.r + "deg", animationDelay: (i * 1.7) + "s" };
      if (it.l) st.left = it.l; else st.right = it.rt;
      return h("span", { key: i, className: "sc", style: st }, ICONS[it.n]());
    }));

const Rev = ({ tag = "div", className = "", delay = 0, children }) => {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (!("IntersectionObserver" in window)) { el.classList.add("in-view"); return; }
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { const t = e.target; t.classList.add("in-view"); io.unobserve(t); setTimeout(() => { t.style.transitionDelay = "0ms"; }, 1200); }
    }), { threshold: 0.15 });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return h(tag, { ref, className: "rev " + className, style: { transitionDelay: delay + "ms" } }, children);
};

const Deco = () => h(React.Fragment, null,
  h("svg", { className: "ecg", viewBox: "0 0 1200 90", preserveAspectRatio: "none", "aria-hidden": "true" },
    h("path", { pathLength: 1400, d: "M0 45H300l20-8 20 8h80l15 10 15-60 25 85 15-35h70H800l20-8 20 8h60l15 10 15-60 25 85 15-35H1200" })),
  [["12%", "8%", 40, 0], ["68%", "44%", 26, 2], ["28%", "72%", 56, 4]].map(([t, l, s, d], i) =>
    h("svg", { key: i, className: "plus", viewBox: "0 0 24 24", width: s, height: s, fill: "currentColor", "aria-hidden": "true", style: { top: t, left: l, animationDelay: d + "s" } },
      h("path", { d: "M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" }))));

const Photo = ({ src, label, className }) =>
  h("div", { className: (className || "arch") + (src ? " ph" : "") },
    src ? h("img", { src, alt: label }) : h("div", null, ICONS.heart("big"), h("div", null, label)));

const Hero = () =>
  h("section", { className: "s1", id: "home" },
    h(Deco),
    h(Scatter, { items: [
      { n: "syringe", t: "10%", l: "42%", s: 150, r: 35 },
      { n: "stethoscope", t: "62%", l: "3%", s: 150, r: -12 },
      { n: "pill", t: "30%", rt: "3%", s: 90, r: 25 }
    ] }),
    h("div", { className: "in" },
      h("div", { className: "hero" },
        h("div", null,
          h("h1", null, "التمريض", h("br"), "في بيتك"),
          h("p", null, "ممرض مدرب يوصلك لحد الباب في " + SITE.city + "، والمريض وسط أهله."),
          h("a", { className: "cta", href: "#contact" }, "تواصل معنا")),
        h("div", { className: "trio" }, ["ربيع", "كريم", "محمود"].map(n => h(Photo, { key: n, src: SITE.team.find(t => t.name === n).photo, label: "الممرض " + n }))))));

const Services = () =>
  h("section", { className: "s2", id: "services" },
    h(Scatter, { items: [
      { n: "syringe", t: "6%", l: "3%", s: 160, r: 40 },
      { n: "stethoscope", t: "55%", rt: "2%", s: 170, r: -10 },
      { n: "pill", t: "78%", l: "12%", s: 90, r: 20 }
    ] }),
    h("div", { className: "in" },
      h("h2", null, "خدماتنا"),
      h("div", { className: "svcs" },
        SITE.services.map(([t, d], i) =>
          h(Rev, { className: "row svc", key: t, delay: i * 80 },
            h("div", { className: "h" },
              h("div", { className: "ico" }, ICONS[ICON_ORDER[i % 5]]()),
              h("b", null, t)),
            h("span", null, d))))));

const Team = () =>
  h("section", { className: "s4", id: "contact" },
    h(Scatter, { items: [
      { n: "scrubs", t: "12%", l: "3%", s: 150, r: -8 },
      { n: "syringe", t: "50%", rt: "3%", s: 150, r: -35 },
      { n: "cross", t: "76%", l: "48%", s: 90, r: 0 },
      { n: "bandage", t: "5%", rt: "6%", s: 120, r: -30 },
      { n: "pill", t: "28%", rt: "9%", s: 100, r: -20 },
      { n: "stethoscope", t: "66%", l: "5%", s: 120, r: 10 }
    ] }),
    h("div", { className: "in" },
      h("h2", null, "تواصل معنا"),
      h("div", { className: "arches" },
        SITE.team.map((t, i) => {
          const ph = SITE.phones.find(p => p.who === t.name);
          return h("article", { key: i, className: "tc" },
            h(Photo, { src: t.photo, label: "صورة الممرض " + t.name }),
            h("div", { className: "nm" }, "الممرض " + t.name),
            h("div", { className: "ar" },
              h("svg", { viewBox: "0 0 24 24", width: 16, height: 16, "aria-hidden": "true" }, h("path", { d: "M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z", fill: "currentColor" })),
              h("span", null, t.area)),
            ph && h("div", { className: "tnum", dir: "ltr" }, ph.number),
            ph && h("div", { className: "tb" },
              h("a", { className: "b1", href: tel(ph.number) }, "اتصل"),
              h("a", { className: "b2", href: waLink(ph.number), "aria-label": "واتساب", title: "واتساب" }, h("svg", { viewBox: "0 0 24 24", fill: "currentColor", "aria-hidden": "true" }, h("path", { d: "M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z" })))));
        }))));

const Footer = () =>
  h("section", { className: "s6" },
    h("div", { className: "in" },
      h("div", { className: "beat" }, ICONS.heart()),
      h("b", null, SITE.name),
      h("p", null, "التمريض المنزلي في " + SITE.city)));

const NAV_ITEMS = [["home", "الرئيسية"], ["services", "خدماتنا"], ["contact", "تواصل معنا"]];
const Nav = () => {
  const [act, setAct] = React.useState(0);
  const [bl, setBl] = React.useState({ x: 0, w: 0, ok: false });
  const [rdy, setRdy] = React.useState(false);
  const nav = React.useRef(null), blob = React.useRef(null), refs = React.useRef([]), lock = React.useRef(0), first = React.useRef(true);

  const measure = React.useCallback(() => {
    const n = nav.current, a = refs.current[act];
    if (!n || !a) return;
    const nr = n.getBoundingClientRect(), ar = a.getBoundingClientRect();
    setBl({ x: ar.left - nr.left, w: ar.width, ok: true });
  }, [act]);

  React.useLayoutEffect(measure, [measure]);

  React.useEffect(() => {
    const t = setTimeout(() => setRdy(true), 80);
    window.addEventListener("resize", measure);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
    return () => { clearTimeout(t); window.removeEventListener("resize", measure); };
  }, [measure]);

  /* حركة "الجيلي" كل ما البقعة تتنقل */
  React.useEffect(() => {
    if (first.current) { first.current = false; return; }
    const b = blob.current;
    if (!b) return;
    b.classList.remove("jelly"); void b.offsetWidth; b.classList.add("jelly");
  }, [act]);

  /* البقعة تتحرك مع التمرير */
  React.useEffect(() => {
    const f = () => {
      if (Date.now() < lock.current) return;
      const H = window.innerHeight;
      let idx = 0;
      NAV_ITEMS.forEach(([id], i) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= H * 0.35) idx = i;
      });
      if (H + window.scrollY >= document.documentElement.scrollHeight - 6) idx = NAV_ITEMS.length - 1;
      setAct(idx);
    };
    window.addEventListener("scroll", f, { passive: true });
    f();
    return () => window.removeEventListener("scroll", f);
  }, []);

  const go = (e, id, i) => {
    const el = document.getElementById(id);
    if (!el) return;
    e.preventDefault();
    lock.current = Date.now() + 1400;
    setAct(i);
    const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const behavior = calm ? "auto" : "smooth";
    if (id === "home") window.scrollTo({ top: 0, behavior }); else el.scrollIntoView({ behavior, block: "start" });
    setTimeout(() => window.dispatchEvent(new Event("scroll")), 1450);
  };

  return h("nav", { className: "nav" + (rdy ? " rdy" : ""), ref: nav, "aria-label": "القائمة" },
    h("span", { className: "blob", ref: blob, "aria-hidden": "true", style: { width: bl.w, transform: "translateX(" + bl.x + "px)", opacity: bl.ok ? 1 : 0 } }),
    NAV_ITEMS.map(([id, t], i) =>
      h("a", { key: id, href: "#" + id, className: act === i ? "on" : "", ref: el => (refs.current[i] = el), onClick: e => go(e, id, i), "aria-current": act === i ? "true" : undefined }, t)));
};

const Light = () => {
  React.useEffect(() => {
    const f = e => {
      const el = e.target.closest && e.target.closest(".row,.st,.rv blockquote");
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (e.clientX - r.left) + "px");
      el.style.setProperty("--my", (e.clientY - r.top) + "px");
    };
    window.addEventListener("pointermove", f, { passive: true });
    return () => window.removeEventListener("pointermove", f);
  }, []);
  return null;
};

const App = () =>
  h(React.Fragment, null,
    h(Nav), h(Hero), h(Services), h(Team), h(Footer), h(Light));

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
